services:
  base:
    extra_hosts:
      - host.docker.internal:host-gateway
    build:
      context: .
      dockerfile: Dockerfile

  debug-app:
    build:
      context: .
      target: food-manager-debug
    ports:
      - "80:80"
      - "5678:5678"
    volumes:
      - ./app_data:/app_data

  prod-app:
    build:
      context: .
      target: food-manager-prod
    ports:
      - "80:80"
    volumes:
      - ./app_data:/app_data

    # environment:
      # pass
